workflows:
  ios-sideload:
    name: GeoTrace iOS Sideload (IPA)
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: 📦 Get Flutter dependencies
        script: |
          flutter pub get
      - name: 📥 Precache iOS engine artifacts
        script: |
          flutter precache --ios
      - name: 💎 Install CocoaPods
        script: |
          cd ios
          pod install
          cd ..
      - name: 🔨 Build iOS Release (No Codesign)
        script: |
          flutter build ios --release --no-codesign
      - name: 🎁 Package into Sideloadable IPA (Payload)
        script: |
          mkdir -p build/sideload/Payload
          cp -R build/ios/iphoneos/Runner.app build/sideload/Payload/
          cd build/sideload
          zip -qry GeoTrace.ipa Payload
          cd ../..
          echo "Berhasil membuat file IPA di: build/sideload/GeoTrace.ipa"
    artifacts:
      - build/sideload/GeoTrace.ipa

  android-release:
    name: GeoTrace Android Release (APK)
    max_build_duration: 20
    instance_type: mac_mini_m1
    environment:
      flutter: stable
    scripts:
      - name: 📦 Get Flutter dependencies
        script: |
          flutter pub get
      - name: 🤖 Build Android APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
